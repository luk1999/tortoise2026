[project]
name = "Tortoise 1.1 (2026)"
version = "1.0.0"
description = "FastAPI app with Tortoise ORM native migrations"
readme = "README.md"
requires-python = "==3.13.*"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.tortoise]
tortoise_orm = "config.TORTOISE_ORM"
